name: Collect and deploy

on:
  schedule:
    - cron: "7 * * * *" # hourly, at :07 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write # daily state backup to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      # State (price history, live auctions, item names, backtest log) lives in the Actions cache
      # between hourly runs, with a daily backup on the `data` branch in case the cache is evicted.
      - name: Restore state (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Restore state (data branch backup)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p state
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C state
            echo "Restored state from the data branch."
          else
            echo "No backup yet; starting fresh."
          fi

      - name: Collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node collector/run.js --state state --out _site

      - name: Save state (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: UTC hour
        id: hour
        run: echo "h=$(date -u +%H)" >> "$GITHUB_OUTPUT"

      - name: Back up state to the data branch (daily, or on manual runs)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.hour.outputs.h == '00')
        run: |
          cd state
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="forever-watcher" -c user.email="actions@users.noreply.github.com" commit -qm "State backup $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
