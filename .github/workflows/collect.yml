name: Collect and deploy

# Cadence: every run queues the next one for a few minutes after Blizzard's next hourly snapshot
# (the `next` job below).
# GitHub's own cron is best-effort and skips hours on new repos, so it is only a backstop
# that restarts the chain if a run ever fails to queue its successor.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "collector/probe.js", ".github/workflows/probe.yml"]

permissions:
  contents: write # daily state backup to the `data` branch
  pages: write
  id-token: write
  actions: write # lets a run queue the next hourly run

jobs:
  collect:
    # Only one collection at a time; the waiting `next` job is outside this lock so it
    # never delays a deploy.
    concurrency:
      group: collect
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      wake_minute: ${{ steps.collect.outputs.wake_minute }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      # State (price history, live auctions, item names, backtest log) lives in the Actions cache
      # between hourly runs, with a daily backup on the `data` branch in case the cache is evicted.
      - name: Restore state (cache)
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Restore state (data branch backup)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p state
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C state
            echo "Restored state from the data branch."
          else
            echo "No backup yet; starting fresh."
          fi

      - name: Collect
        id: collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node collector/run.js --state state --out _site

      - name: Save state (cache)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: UTC hour
        id: hour
        run: echo "h=$(date -u +%H)" >> "$GITHUB_OUTPUT"

      - name: Back up state to the data branch (daily, or on manual runs)
        # Daily at 00 UTC, after a code push, or when you start a run by hand.
        if: steps.hour.outputs.h == '00' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]')
        run: |
          cd state
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="forever-watcher" -c user.email="actions@users.noreply.github.com" commit -qm "State backup $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  next:
    needs: [collect, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Wakes a few minutes after Blizzard's hourly publish time (learned from Last-Modified by the
      # collect job), so the site's prices are minutes old rather than up to an hour old.
      - name: Wait for Blizzard's next hourly snapshot, then queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WAKE_MINUTE: ${{ needs.collect.outputs.wake_minute }}
        run: |
          m=${WAKE_MINUTE:-32}
          now=$(date -u +%s)
          wait=$(( (3600 - now % 3600 + m * 60) % 3600 ))
          [ "$wait" -lt 600 ] && wait=$(( wait + 3600 ))
          echo "Sleeping ${wait}s"
          sleep "$wait"
          # Exactly one chain: only the newest run queues the next. If a newer run exists
          # (a push, a manual run or the cron backstop), it owns the chain instead.
          newer=$(gh api "repos/$REPO/actions/workflows/collect.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.id > ${{ github.run_id }})] | length')
          if [ "$newer" -gt 0 ]; then echo "A newer run exists; it will queue the next one."; exit 0; fi
          gh workflow run collect.yml --repo "$REPO" --ref main
